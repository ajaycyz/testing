<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="section checkout-layout">
    <section>
      <h1>Billing Details</h1>
      <form class="checkout-form">
        <input placeholder="Name" required><input placeholder="Phone" required><input placeholder="Email" required>
        <input placeholder="Address" required><input placeholder="City" required><input placeholder="State" required><input placeholder="PIN Code" required>
      </form>
    </section>
    <aside class="card">
      <h2>Order Summary</h2>
      <p>Premium Tap Set ×1 — ₹1,499</p>
      <h3>Payment Options</h3>
      <label><input type="radio" name="pay" checked> Cash on Delivery</label>
      <label><input type="radio" name="pay"> UPI</label>
      <label><input type="radio" name="pay"> Credit/Debit Card</label>
      <p><strong>Total: ₹1,649</strong></p>
      <a class="btn btn-blue" href="success.html">Place Order</a>
    </aside>
  </main>
</body>
</html>
