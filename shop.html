<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Plumbing Products</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="main-header sticky compact">
    <a class="logo" href="index.html"><span class="brand-blue">Saklani</span><span class="brand-black">Plumber Service</span></a>
    <nav><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="cart.html">Cart</a><a class="btn btn-blue" href="checkout.html">Checkout</a></nav>
  </header>
  <main class="section">
    <h1>Shop Plumbing Products</h1>
    <div class="shop-layout">
      <aside class="card filters">
        <h3>Filters</h3>
        <label>Categories</label>
        <select><option>All Categories</option><option>Taps</option><option>Pipes</option><option>Fittings</option></select>
        <label>Price Filter</label>
        <input type="range" min="100" max="5000" value="2500">
      </aside>
      <section class="grid product-grid">
        <article class="product-card"><div class="product-image"></div><h3>Premium Tap Set</h3><p class="price">₹1,499</p><button class="btn btn-blue">Add to Cart</button><a href="product.html">View Details</a></article>
        <article class="product-card"><div class="product-image"></div><h3>PVC Pipe Bundle</h3><p class="price">₹899</p><button class="btn btn-blue">Add to Cart</button><a href="product.html">View Details</a></article>
        <article class="product-card"><div class="product-image"></div><h3>Wash Basin Mixer</h3><p class="price">₹2,199</p><button class="btn btn-blue">Add to Cart</button><a href="product.html">View Details</a></article>
        <article class="product-card"><div class="product-image"></div><h3>Shower Head Pro</h3><p class="price">₹1,099</p><button class="btn btn-blue">Add to Cart</button><a href="product.html">View Details</a></article>
      </section>
    </div>
  </main>
</body>
</html>
