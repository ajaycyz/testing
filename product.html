<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="section">
    <div class="product-detail">
      <div>
        <div class="product-image large"></div>
        <div class="thumbs"><div class="product-image thumb"></div><div class="product-image thumb"></div><div class="product-image thumb"></div></div>
      </div>
      <div>
        <h1>Premium Tap Set</h1>
        <p class="price">₹1,499</p>
        <p>Stock Status: <strong>In Stock</strong></p>
        <label>Quantity <input type="number" min="1" value="1"></label>
        <div class="actions"><button class="btn btn-blue">Add to Cart</button><a class="btn btn-dark" href="checkout.html">Buy Now</a></div>
      </div>
    </div>
    <div class="tabs"><button>Description</button><button>Additional Info</button><button>Reviews</button></div>
    <div class="card"><p>Built with premium chrome finish for durability and smooth flow control.</p></div>
  </main>
</body>
</html>
