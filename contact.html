<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Hamilton & Rowe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-wrap">
      <a href="index.html" class="brand">Hamilton &amp; Rowe</a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="practice-area.html">Practice Areas</a>
        <a href="index.html#team">Our Team</a>
        <a href="contact.html">Contact</a>
      </nav>
      <a class="btn btn-outline" href="contact.html">Schedule Consultation</a>
    </div>
  </header>

  <section class="inner-hero">
    <div class="container centered">
      <p class="eyebrow">Contact</p>
      <h1>Start Your Consultation</h1>
    </div>
  </section>

  <section class="section">
    <div class="container two-col contact-short">
      <div>
        <h2>Office Details</h2>
        <p><strong>Phone:</strong> +60 3-1234 5678</p>
        <p><strong>Email:</strong> hello@hamiltonrowe.com</p>
        <p><strong>Address:</strong> Level 12, Tower A, Kuala Lumpur City Centre, Malaysia</p>
        <form class="contact-form">
          <input type="text" placeholder="Full Name" aria-label="Full Name" />
          <input type="email" placeholder="Email Address" aria-label="Email Address" />
          <textarea rows="6" placeholder="Tell us about your legal matter" aria-label="Message"></textarea>
          <button class="btn btn-primary" type="submit">Submit Inquiry</button>
        </form>
      </div>
      <div>
        <iframe
          title="Office Map"
          src="https://www.google.com/maps?q=Kuala+Lumpur+City+Centre&output=embed"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="copyright">© 2026 Hamilton &amp; Rowe. All Rights Reserved.</div>
  </footer>
</body>
</html>
